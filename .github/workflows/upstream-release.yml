name: Build x64 from latest PCL-CE stable release

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency:
  group: pcl-ce-upstream-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      upstream_tag: ${{ steps.release.outputs.upstream_tag }}
      upstream_sha: ${{ steps.release.outputs.upstream_sha }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      already_released: ${{ steps.release.outputs.already_released }}
    steps:
      - name: Check out automation files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find latest upstream stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          upstream_tag="$(gh api repos/PCL-Community/PCL-CE/releases/latest --jq .tag_name)"
          if [[ -z "$upstream_tag" || "$upstream_tag" == "null" ]]; then
            echo "Could not determine latest upstream stable release" >&2
            exit 1
          fi

          upstream_sha="$(gh api "repos/PCL-Community/PCL-CE/commits/${upstream_tag}" --jq .sha)"
          release_tag="pcl-ce-${upstream_tag}-custom-x64"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
            echo "Release $release_tag already exists; nothing to do."
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
            echo "Found upstream $upstream_tag ($upstream_sha)."
          fi

      - name: Check out the exact upstream release source
        if: steps.release.outputs.already_released != 'true'
        env:
          UPSTREAM_TAG: ${{ steps.release.outputs.upstream_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$UPSTREAM_TAG" \
            https://github.com/PCL-Community/PCL-CE.git source

      - name: Apply and verify local source patches
        if: steps.release.outputs.already_released != 'true'
        run: python3 scripts/patch-region-policy.py source

      - name: Set up .NET 10
        if: steps.release.outputs.already_released != 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build x64 release
        if: steps.release.outputs.already_released != 'true'
        env:
          UPSTREAM_TAG: ${{ steps.release.outputs.upstream_tag }}
          PCL_GITHUB_SHA: ${{ steps.release.outputs.upstream_sha }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish "source/Plain Craft Launcher 2/Plain Craft Launcher 2.csproj" \
            -p:Configuration=Release \
            -p:Platform=x64 \
            -p:DeleteExistingFiles=true \
            -o ./artifact \
            --no-self-contained
          test -s "./artifact/Plain Craft Launcher 2.exe"
          mv "./artifact/Plain Craft Launcher 2.exe" \
            "./artifact/PCL-CE-${UPSTREAM_TAG}-custom-x64.exe"
          cd artifact
          sha256sum PCL-CE-*-custom-x64.exe > SHA256SUMS.txt

      - name: Upload x64 build artifact
        if: steps.release.outputs.already_released != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PCL-CE-${{ steps.release.outputs.upstream_tag }}-custom-x64
          path: |
            artifact/PCL-CE-*-custom-x64.exe
            artifact/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: needs.build.outputs.already_released != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download x64 build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PCL-CE-${{ needs.build.outputs.upstream_tag }}-custom-x64
          path: artifact

      - name: Publish custom release to this fork
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.build.outputs.upstream_tag }}
          UPSTREAM_SHA: ${{ needs.build.outputs.upstream_sha }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          title="PCL-CE ${UPSTREAM_TAG} (Unofficial x64)"
          notes="中国式家长牛逼"
          gh release create "$RELEASE_TAG" \
            artifact/PCL-CE-*-custom-x64.exe \
            artifact/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "$notes"
